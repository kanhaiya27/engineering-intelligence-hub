# ============================================================
# Engineering Intelligence Hub — Model Registry
# configs/models.yaml
#
# IMPORTANT: Cost, energy and latency figures are REFERENCE ESTIMATES.
# Verify against provider pricing pages before publishing results.
# Actual measured values are collected during experiments.
#
# Update this file when:
# - Provider pricing changes
# - New models are added
# - Measured values replace reference estimates
# ============================================================

models:
  # ---------- OpenAI ----------
  - model_id: gpt-4o-mini
    display_name: "GPT-4o Mini"
    provider: openai
    tier: small
    context_window_tokens: 128000
    max_output_tokens: 16384
    ref_input_cost_per_1m_tokens: 0.15
    ref_output_cost_per_1m_tokens: 0.60
    ref_latency_p50_ms: 800
    ref_latency_p95_ms: 3000
    ref_energy_per_1k_output_tokens_wh: null  # To be measured
    supports_function_calling: true
    supports_streaming: true
    default_temperature: 0.1
    default_max_tokens: 2048
    recommended_for_task_types:
      - code_explanation
      - requirement_retrieval
      - test_explanation
      - review_assistance

