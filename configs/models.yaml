# ============================================================
# Engineering Intelligence Hub — Model Registry
# configs/models.yaml
#
# Describes the local models the project uses (local models only — original
# plan, MASTER_DATASET_SPECIFICATION §1): tier, digest, measured values.
# HOW they are called (num_ctx, num_gpu, temperature, seed, output limit) is
# NOT here: configs/inference.yaml is the single source of truth for that.
# Paid-API models (OpenAI / Anthropic / Google) and local/llama-3-8b were
# removed on 2026-10-05: never used, and contrary to the local-only decision.
# ============================================================

models:
  # ---------- Local ladder (Ollama) — the models actually used (local-only, RD-013) ----------
  # Digests pinned in CLAUDE.md. Measured values: experiments/results/phase1/machine_A/.
  - model_id: "qwen2.5-coder:1.5b"
    display_name: "Qwen2.5-Coder 1.5B Instruct (Q4_K_M, Ollama)"
    provider: local
    tier: small
    context_window_tokens: 32768
    max_output_tokens: 8192
    ref_input_cost_per_1m_tokens: 0.0
    ref_output_cost_per_1m_tokens: 0.0
    supports_streaming: true
    is_available_locally: true
    api_base_url: "http://localhost:11434"
    default_temperature: 0.0
    extra:
      digest: "d7372fd828518a4d38b1eb196c673c31a85f2ed302b3d1e406c4c2d1b64a0668"
      measured_laptop_a: "100% on GPU; 131 tok/s; 105.7 J per warm call (vram_study.json)"

  - model_id: "qwen2.5-coder:3b"
    display_name: "Qwen2.5-Coder 3B Instruct (Q4_K_M, Ollama)"
    provider: local
    tier: medium
    context_window_tokens: 32768
    max_output_tokens: 8192
    ref_input_cost_per_1m_tokens: 0.0
    ref_output_cost_per_1m_tokens: 0.0
    supports_streaming: true
    is_available_locally: true
    api_base_url: "http://localhost:11434"
    default_temperature: 0.0
    extra:
      digest: "f72c60cabf6237b07f6e632b2c48d533cef25eda2efbd34bed21c5e9c01e6225"
      measured_laptop_a: "100% on GPU; 76 tok/s; 174.2 J per warm call (vram_study.json)"

  - model_id: "qwen2.5-coder:7b"
    display_name: "Qwen2.5-Coder 7B Instruct (Q4_K_M, Ollama, all layers on GPU)"
    provider: local
    tier: large
    context_window_tokens: 32768
    max_output_tokens: 8192
    ref_input_cost_per_1m_tokens: 0.0
    ref_output_cost_per_1m_tokens: 0.0
    supports_streaming: true
    is_available_locally: true
    api_base_url: "http://localhost:11434"
    default_temperature: 0.0
    extra:
      digest: "dae161e27b0e90dd1856c8bb3209201fd6736d8eb66298e75ed87571486f4364"
      # Ollama's default placement put only 82% on the GPU; forcing all layers is
      # 72% faster and 21% less energy per call and fits at num_ctx 4096 with the
      # encoders resident (vram_study_7b_forced_gpu.json). At the num_ctx 12288 used
      # for all runs it still fits fully: 34.6 tok/s, peak 5,906 of 6,141 MiB
      # (long_context_probe.json).
      measured_laptop_a: "100% on GPU (forced); 38 tok/s; 306.8 J per warm call (vram_study_7b_forced_gpu.json)"
