# datasets/registry.yaml
# ==========================================================================
# Engineering Intelligence Hub — Open-Source Repository Registry
#
# Target: 4–5 carefully selected repositories covering diverse SDLC domains.
#
# Selection criteria:
#   - Permissive licence (MIT, Apache-2.0, BSD)
#   - Rich commit history (>1 year)
#   - Active issue tracker
#   - Available tests
#   - Non-trivial codebase (>10k LOC preferred)
#   - Public/open — no proprietary data
#
# Status legend:
#   candidate  : Under consideration
#   selected   : Confirmed for benchmark
#   ingested   : Fully ingested into knowledge store
#   deprecated : Removed from dataset
#
# ==========================================================================

repositories: []
