version: "3.9"

# ============================================================
# Engineering Intelligence Hub — Docker Compose Services
#
# Phase-1 services: Qdrant vector store + Neo4j graph store
#
# Usage:
#   docker compose up -d
#   docker compose down
#
# Data is persisted in named volumes (survives container restart).
# ============================================================

services:

  # ----------------------------------------------------------
  # Qdrant — Vector Store
  # REST API: http://localhost:6333
  # gRPC:     localhost:6334
  # Dashboard: http://localhost:6333/dashboard
  # ----------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: eih-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  # Neo4j — Graph Store
  # Browser UI:  http://localhost:7474
  # Bolt:        bolt://localhost:7687
  # Default auth: neo4j / changeme (set EIH_GRAPH_PASSWORD)
  # ----------------------------------------------------------
  neo4j:
    image: neo4j:5.18-community
    container_name: eih-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"    # HTTP browser
      - "7687:7687"    # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      NEO4J_AUTH: neo4j/${EIH_GRAPH_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 2G
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${EIH_GRAPH_PASSWORD:-changeme}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
